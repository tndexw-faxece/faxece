<meta charset="UTF-8">
<style>
   body{
      background-color: rgb(1, 0, 24);
      text-align: center;
   }
   h1{
      color: rgb(0, 102, 255);
      text-shadow: 0 0 20px rgb(0, 102, 255);
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
   }
   b h1{
      color: rgb(147, 205, 255);
      font-family: 'Times New Roman', Times, serif;
   }
   h2{
      color: white;
      text-shadow: 0 0 20px white;
   }
   img{
      border-radius: 50%;
      border: 4px solid white;
      width: 300px;
      height: 300px;
      object-fit: cover;
      box-shadow: 0 0 30px blue;
   }
   m{
      color: blue;
   }
   a{
      text-decoration: none;
   }
   a h3{
      color: cadetblue;
      text-shadow: 0 0 15px cadetblue;
      font-family: Georgia, 'Times New Roman', Times, serif;
   }
</style>
<title>法克西的留言板</title>
<h1 onclick="alert('不要乱戳法克西')">法 克 西 共 和 国</h1>
<img src=Faxece.png>
<b>
   <h1>F A X E C E republic</h1>
</b>

{% for m in messages %}
   {{m.name}} - {{m.msg}}
{% endfor %}

<form action="board-faxece.vercel.app" method="POST">
   <input name="name" placeholder="你的名字">
   <input name="message" placeholder="内容">
   <button type="submit">发送</button>
</form>
